name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Unit tests with coverage
        run: python scripts/run_coverage.py

  trigger-ai-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the AI Pipeline
        env:
          GH_TOKEN: ${{ secrets.AI_PIPELINE_TOKEN }}
          AI_REPO: ${{ github.repository_owner }}/club-management-ai
          BRANCH: ${{ github.ref_name }}
        run: |
          ref=main
          if gh api "repos/$AI_REPO/branches/$BRANCH" > /dev/null 2>&1; then
            ref=$BRANCH
          fi
          gh workflow run ci.yml -R "$AI_REPO" --ref "$ref" -f project_branch="$BRANCH"
