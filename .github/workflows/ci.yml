name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Report missing project
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') == ''
        run: echo "::notice::No Python project yet, so there is nothing to check."

      - uses: actions/setup-python@v7
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') != ''
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') != ''
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') != ''
        run: ruff check .

      - name: Type check
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') != ''
        run: mypy .

      - name: Unit tests with coverage
        if: hashFiles('requirements.txt', 'requirements-dev.txt', 'pyproject.toml') != ''
        run: |
          if [ -d tests ]; then
            pytest --cov=. --cov-fail-under=80
          else
            echo "::warning::No tests directory, so tests and the 80% coverage gate did not run."
          fi
